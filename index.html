<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工事管理くん</title>
<style>
:root{--bg:#0c0d10;--line:rgba(255,255,255,.08);--text:#f4f6fb;--muted:#aab3c5;--gold:#d8b35c;--gold2:#f0d28d}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0a0b0f,#0d1016 50%, #0b0d12)}
.app{min-height:100vh;display:grid;grid-template-columns:80px 1fr 380px;gap:18px;padding:18px}
.sidebar,.right,.main-shell{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:24px}
.sidebar{display:flex;flex-direction:column;align-items:center;padding:14px 10px;gap:12px}.logo-mini,.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#1b1403;font-weight:900;background:linear-gradient(180deg,var(--gold2),var(--gold))}
.nav-btn{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#dce3f1;display:grid;place-items:center}.nav-btn.active{background:rgba(216,179,92,.14)}.spacer{flex:1}
.main-shell{overflow:hidden;display:grid;grid-template-rows:auto auto 1fr}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 14px;border-bottom:1px solid var(--line)}
.title h1{margin:0;font-size:38px}.title p{margin:6px 0 0;color:var(--muted);font-size:14px}.search-row{display:flex;align-items:center;gap:12px;min-width:360px}
.search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:330px}.search input{flex:1;background:transparent;border:none;outline:none;color:var(--text)}
button{border:none;cursor:pointer;border-radius:14px;font-weight:700}.ghost-btn,.filter-btn,.small-btn{background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--line);padding:12px 14px}.small-btn{padding:8px 10px;font-size:12px}.gold-btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;padding:12px 18px}
.stats{padding:18px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:22px;padding:18px}.stat .label{color:var(--muted);font-size:13px;margin-bottom:8px}.stat .value{font-size:38px;font-weight:900}
.banner{margin:0 24px 18px;background:linear-gradient(90deg,rgba(216,179,92,.18),rgba(216,179,92,.08));border:1px solid rgba(216,179,92,.22);border-radius:22px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.banner small{display:block;color:#ecdfbb}.usage{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 12px;border-radius:999px;font-size:13px;font-weight:800}.pill.gold{background:rgba(216,179,92,.16);color:#f5dda0}.pill.blue{background:rgba(105,167,255,.16);color:#cce0ff}.pill.red{background:rgba(255,106,106,.16);color:#ffd1d1}
.main{padding:0 24px 24px;display:grid;grid-template-rows:auto auto 1fr;min-height:0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}.section-head h2{margin:0;font-size:36px}.section-head p{margin:6px 0 0;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter-btn.active{background:rgba(216,179,92,.14)}
.board-wrap{min-height:0;overflow:auto;padding-bottom:8px}.board{display:grid;grid-template-columns:repeat(6,minmax(250px,1fr));gap:14px;min-width:1600px}
.column{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:22px;padding:14px;min-height:560px}.column.drag-over{outline:2px solid rgba(216,179,92,.45)}.column-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.column-title{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}.dot{width:10px;height:10px;border-radius:50%}.count{min-width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:12px;font-weight:800}.cards{display:flex;flex-direction:column;gap:12px;min-height:60px}
.card{background:linear-gradient(180deg,rgba(102,144,255,.09),rgba(216,179,92,.08));border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:14px;cursor:pointer}.card.active{box-shadow:0 0 0 2px rgba(216,179,92,.28) inset}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.card h3{margin:0;font-size:24px;line-height:1.25}.badge{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.badge.orange{background:rgba(255,180,88,.18);color:#ffd39d}.badge.green{background:rgba(76,224,160,.16);color:#bff8de}.badge.red{background:rgba(255,106,106,.16);color:#ffd2d2}.badge.blue{background:rgba(105,167,255,.16);color:#cfe1ff}
.meta{margin-top:10px;color:#dfe6f3;font-size:14px;line-height:1.7}.meta span{display:block}.label-muted{color:#a7b0c0}.progress{margin-top:12px}.progress .row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}.bar{height:9px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#7cb3ff,#ebc75e);border-radius:999px}.mini-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.mini-tag{background:rgba(255,255,255,.08);padding:6px 8px;border-radius:10px;font-size:12px;font-weight:700}
.right{padding:18px;display:grid;grid-template-rows:auto auto 1fr;gap:14px}.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini-stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:14px}.mini-stat .label{color:var(--muted);font-size:12px}.mini-stat .value{margin-top:8px;font-size:18px;font-weight:900;word-break:break-all}
.detail{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;min-height:0}.detail-head{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:8px}.detail h4{margin:0;font-size:26px}.hint{color:var(--muted);font-size:13px;margin-top:6px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.detail-item{border-top:1px dashed rgba(255,255,255,.08);padding-top:10px}.detail-item .k{font-size:12px;color:var(--muted)}.detail-item .v{margin-top:6px;font-size:18px;font-weight:800}
.box{margin-top:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:18px;padding:12px}.box h5{margin:0 0 12px;font-size:14px;color:#f3e2b0}.file-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed rgba(255,255,255,.08)}.file-item:first-of-type{border-top:none;padding-top:0}.file-name{font-size:14px;font-weight:700;word-break:break-all}.file-sub{font-size:12px;color:var(--muted);margin-top:4px}.upload-row{display:flex;gap:8px;flex-wrap:wrap}.upload-row select,.upload-row input[type=file]{flex:1;min-width:0;background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.detail-actions{display:flex;gap:10px;margin-top:12px}.detail-actions .ghost-btn,.detail-actions .gold-btn{flex:1}
.loading,.empty,.error{padding:18px;border-radius:18px;margin-bottom:12px;border:1px solid var(--line);background:rgba(255,255,255,.04)}.error{border-color:rgba(255,106,106,.2);background:rgba(255,106,106,.07);color:#ffd4d4}
.modal-backdrop{position:fixed;inset:0;background:rgba(2,4,10,.54);display:none;place-items:center;z-index:100}.modal-backdrop.show{display:grid}.modal{width:min(640px,calc(100vw - 32px));background:linear-gradient(180deg,#141821,#10131a);border:1px solid var(--line);border-radius:24px;padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;font:inherit}.field textarea{min-height:96px;resize:vertical}
@media (max-width:1200px){.app{grid-template-columns:72px 1fr}.right{display:none}}@media (max-width:820px){.app{display:block;padding:10px}.sidebar{display:none}.topbar{display:block;padding:16px}.title h1{font-size:28px}.search-row{min-width:0;margin-top:14px;flex-wrap:wrap}.search{min-width:0;width:100%}.stats{grid-template-columns:1fr 1fr;padding:14px 16px}.banner{margin:0 16px 16px;flex-direction:column;align-items:flex-start}.main{padding:0 16px 24px}.section-head{display:block}.section-head h2{font-size:28px}.board{grid-template-columns:repeat(6,84vw);min-width:max-content}}
</style></head>
<body>
<div class="app"><aside class="sidebar"><div class="logo-mini">工</div><div class="nav-btn active">⌂</div><div class="nav-btn">▦</div><div class="nav-btn">▤</div><div class="nav-btn">⌘</div><div class="nav-btn">⌁</div><div class="spacer"></div><div class="nav-btn">⚙︎</div></aside>
<section class="main-shell"><div class="topbar"><div class="title"><h1>工事管理くん</h1><p>案件・工程・図面・写真・QRをまとめる管理ダッシュボード</p></div><div class="search-row"><div class="search"><span>⌕</span><input id="searchInput" placeholder="案件名・顧客名・住所で検索"></div><button class="ghost-btn" id="toggleFilterBtn">すべて</button><button class="gold-btn" id="openModalBtn">＋ 案件追加</button></div></div>
<div><div class="stats"><div class="stat"><div class="label">総案件数</div><div class="value" id="statTotal">0</div><div class="sub" id="statTotalSub">読み込み中</div></div><div class="stat"><div class="label">施工中</div><div class="value" id="statInProgress">0</div><div class="sub" id="statInProgressSub">読み込み中</div></div><div class="stat"><div class="label">今週完了予定</div><div class="value" id="statThisWeek">0</div><div class="sub">要確認件数</div></div><div class="stat"><div class="label">遅延案件</div><div class="value" id="statDelayed">0</div><div class="sub">優先確認が必要</div></div></div>
<div class="banner"><div><div><span style="font-size:14px;color:#f5dfa4">現在のプラン</span> <b>FREE</b></div><small>案件 5件まで・QR 1件まで・保存容量 100MBまで。R2アップロード対応済み。</small></div><div class="usage"><span class="pill gold">案件 <b id="usageProjects">0/5</b></span><span class="pill blue">QR <b id="usageQr">0/1</b></span><span class="pill red" id="usageDelay">遅延 0件</span><button class="gold-btn">Proにアップグレード</button></div></div></div>
<div class="main"><div class="section-head"><div><h2>工程管理</h2><p>案件カードをドラッグして進捗ステータスを更新。</p></div><div class="filters"><button class="filter-btn active" data-filter="all">すべて</button><button class="filter-btn" data-filter="priority">優先</button><button class="filter-btn" data-filter="delay">遅延</button><button class="filter-btn" data-filter="thisweek">今週完了</button></div></div><div id="messageArea"></div><div class="board-wrap"><div class="board" id="board"></div></div></div></section>
<aside class="right"><div><h3 style="margin:0 0 6px;font-size:24px">こんにちは</h3><p style="margin:0;color:var(--muted);font-size:13px">Worker URL は設定済み。R2で図面・写真アップロードまで対応。</p></div><div class="mini-stats"><div class="mini-stat"><div class="label">API接続先</div><div class="value" id="apiHostView"></div></div><div class="mini-stat"><div class="label">対象ユーザー</div><div class="value" id="userView"></div></div></div><div class="detail" id="detailPanel"></div></aside></div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h3 style="margin:0 0 14px;font-size:28px">案件追加</h3><div class="form-grid"><div class="field full"><label>案件名</label><input id="fName"></div><div class="field"><label>顧客名</label><input id="fCustomer"></div><div class="field"><label>担当者</label><input id="fManager"></div><div class="field full"><label>現場住所</label><input id="fAddress"></div><div class="field"><label>ステータス</label><select id="fStatus"></select></div><div class="field"><label>進捗率</label><input id="fProgress" type="number" min="0" max="100" value="20"></div><div class="field"><label>開始日</label><input id="fStart" type="date"></div><div class="field"><label>終了日</label><input id="fEnd" type="date"></div><div class="field full"><label>メモ</label><textarea id="fMemo"></textarea></div></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px"><button class="ghost-btn" id="closeModalBtn">閉じる</button><button class="gold-btn" id="saveProjectBtn">保存する</button></div></div></div>

<script>
const CONFIG={API_BASE:"https://koujikanri-worker.ssssqqqq255.workers.dev",USER_ID:"demo-user"};
const STATUSES=[{key:"見積中",color:"#ffb458"},{key:"受注",color:"#9d7cff"},{key:"着工前",color:"#6ecdfb"},{key:"施工中",color:"#69a7ff"},{key:"検査",color:"#4ce0a0"},{key:"完了",color:"#50db87"}];
let state={projects:[],selectedId:null,filter:"all",search:"",loading:false,error:"",filesByProject:{}};
const board=document.getElementById("board"),detailPanel=document.getElementById("detailPanel"),statusSelect=document.getElementById("fStatus"),messageArea=document.getElementById("messageArea");
STATUSES.forEach(s=>{const o=document.createElement("option");o.value=s.key;o.textContent=s.key;statusSelect.appendChild(o);});
document.getElementById("apiHostView").textContent=CONFIG.API_BASE.replace(/^https?:\/\//,"");document.getElementById("userView").textContent=CONFIG.USER_ID;
document.getElementById("openModalBtn").onclick=()=>document.getElementById("modalBackdrop").classList.add("show");
document.getElementById("closeModalBtn").onclick=()=>document.getElementById("modalBackdrop").classList.remove("show");
document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")document.getElementById("modalBackdrop").classList.remove("show");});
document.getElementById("saveProjectBtn").onclick=saveProject;
document.getElementById("searchInput").addEventListener("input",e=>{state.search=e.target.value.trim();render();});
document.querySelectorAll(".filter-btn").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");state.filter=btn.dataset.filter;document.getElementById("toggleFilterBtn").textContent=btn.textContent;render();}));
init();
async function init(){state.loading=true;renderMessage();try{await ensureSeed();await fetchProjects();state.error="";}catch(e){state.error=e.message||"初期化に失敗しました";}state.loading=false;render();}
async function ensureSeed(){try{await api("/api/seed");}catch(e){}}
async function fetchProjects(){const data=await api(`/api/projects?user_id=${encodeURIComponent(CONFIG.USER_ID)}`);state.projects=(data.projects||[]).map(normalizeProject);if(!state.selectedId&&state.projects[0])state.selectedId=state.projects[0].id;if(state.selectedId&&!state.projects.find(p=>p.id===state.selectedId))state.selectedId=state.projects[0]?.id||null;if(state.selectedId)await fetchFiles(state.selectedId);render();}
async function fetchFiles(projectId){const data=await api(`/api/files?project_id=${encodeURIComponent(projectId)}`);state.filesByProject[projectId]=data.files||[];}
function normalizeProject(p){return{id:p.id,name:p.name||"無題案件",customer:p.customer_name||"未設定",address:p.address||"未設定",manager:p.manager||"未設定",status:p.status||"見積中",progress:Number(p.progress||0),start:p.start_date||"",end:p.end_date||"",drawings:Number(p.drawings||0),estimates:Number(p.estimates||0),photos:Number(p.photos||0),priority:p.priority||"未設定",note:p.note||"",qr_count:Number(p.qr_count||0),updates:[p.updated_at?`最終更新：${String(p.updated_at).slice(0,16).replace("T"," ")}`:"更新情報なし",p.note||"補足なし"]};}
function render(){renderMessage();renderBoard();renderDetail();renderStats();}
function renderMessage(){if(state.loading){messageArea.innerHTML=`<div class="loading">読み込み中...</div>`;return;}if(state.error){messageArea.innerHTML=`<div class="error">${escapeHtml(state.error)}</div>`;return;}if(!state.projects.length){messageArea.innerHTML=`<div class="empty">案件がありません。新規案件を追加してください。</div>`;return;}messageArea.innerHTML="";}
function renderBoard(){board.innerHTML="";STATUSES.forEach(status=>{const visible=getVisibleProjects().filter(p=>p.status===status.key);const column=document.createElement("div");column.className="column";column.innerHTML=`<div class="column-head"><div class="column-title"><span class="dot" style="background:${status.color}"></span><span>${status.key}</span></div><div class="count">${visible.length}</div></div><div class="cards"></div>`;const wrap=column.querySelector(".cards");visible.forEach(project=>wrap.appendChild(renderCard(project)));column.addEventListener("dragover",e=>{e.preventDefault();column.classList.add("drag-over");});column.addEventListener("dragleave",()=>column.classList.remove("drag-over"));column.addEventListener("drop",async e=>{e.preventDefault();column.classList.remove("drag-over");const id=e.dataTransfer.getData("text/plain");await moveProject(id,status.key);});board.appendChild(column);});}
function renderCard(project){const delayed=isDelayed(project);const badgeClass=delayed?"red":(project.priority.includes("完了")||project.priority.includes("順調")||project.priority.includes("準備")?"green":project.priority.includes("入金")?"blue":"orange");const el=document.createElement("div");el.className="card"+(state.selectedId===project.id?" active":"");el.draggable=true;el.innerHTML=`<div class="card-top"><h3>${escapeHtml(project.name)}</h3><span class="badge ${badgeClass}">${delayed?"遅延注意":escapeHtml(project.priority)}</span></div><div class="meta"><span><span class="label-muted">顧客：</span>${escapeHtml(project.customer)}</span><span><span class="label-muted">現場：</span>${escapeHtml(project.address)}</span><span><span class="label-muted">担当：</span>${escapeHtml(project.manager)}</span></div><div class="progress"><div class="row"><span>進捗</span><strong>${project.progress}%</strong></div><div class="bar"><i style="width:${project.progress}%"></i></div></div><div class="mini-tags"><span class="mini-tag">図面 ${project.drawings}</span><span class="mini-tag">見積 ${project.estimates}</span><span class="mini-tag">写真 ${project.photos}</span></div>`;el.addEventListener("click",async()=>{state.selectedId=project.id;await fetchFiles(project.id);render();});el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",project.id));return el;}
function renderDetail(){const project=state.projects.find(p=>p.id===state.selectedId)||state.projects[0];if(!project){detailPanel.innerHTML=`<div class="hint">案件がありません</div>`;return;}const files=state.filesByProject[project.id]||[];detailPanel.innerHTML=`<div class="detail-head"><div><h4>${escapeHtml(project.name)}</h4><div class="hint">選択中の案件詳細</div></div><span class="badge ${isDelayed(project)?'red':'orange'}">${isDelayed(project)?'遅延注意':escapeHtml(project.priority)}</span></div><div class="detail-grid"><div class="detail-item"><div class="k">顧客</div><div class="v">${escapeHtml(project.customer)}</div></div><div class="detail-item"><div class="k">現場住所</div><div class="v">${escapeHtml(project.address)}</div></div><div class="detail-item"><div class="k">担当者</div><div class="v">${escapeHtml(project.manager)}</div></div><div class="detail-item"><div class="k">工期</div><div class="v">${formatDate(project.start)} ～ ${formatDate(project.end)}</div></div><div class="detail-item"><div class="k">進捗率</div><div class="v">${project.progress}%</div></div><div class="detail-item"><div class="k">QR</div><div class="v">${project.qr_count||0}件</div></div></div><div class="box"><h5>図面・写真アップロード</h5><div class="upload-row"><select id="uploadType"><option value="drawing">図面</option><option value="photo">写真</option><option value="estimate">見積</option></select><input id="uploadFile" type="file"></div><div class="detail-actions"><button class="gold-btn" id="uploadBtn">アップロード</button></div></div><div class="box"><h5>保存ファイル</h5>${files.length?files.map(f=>`<div class="file-item"><div><div class="file-name">${escapeHtml(f.file_name||"untitled")}</div><div class="file-sub">${escapeHtml(f.file_type||"-")} ・ ${formatBytes(Number(f.file_size||0))}</div></div><a class="small-btn" href="${escapeAttr(f.file_url||"#")}" target="_blank" rel="noopener noreferrer">開く</a></div>`).join(""):`<div class="file-sub">まだファイルはありません</div>`}</div><div class="box"><h5>本日の更新</h5>${project.updates.map(t=>`<div class="file-item"><div><div class="file-name">${escapeHtml(t)}</div><div class="file-sub">${escapeHtml(project.note||"")}</div></div></div>`).join("")}</div><div class="detail-actions"><button class="ghost-btn" id="refreshBtn">再読込</button><button class="gold-btn" id="qrBtn">QRを発行</button></div>`;document.getElementById("refreshBtn").onclick=async()=>{await fetchFiles(project.id);await fetchProjects();};document.getElementById("qrBtn").onclick=()=>createQr(project.id);document.getElementById("uploadBtn").onclick=()=>uploadFile(project.id);}
function renderStats(){const visible=getVisibleProjects(),total=state.projects.length,inProgress=state.projects.filter(p=>p.status==="施工中").length,delayed=state.projects.filter(isDelayed).length,thisWeek=state.projects.filter(isThisWeekEnd).length,qrTotal=state.projects.reduce((a,p)=>a+(p.qr_count||0),0);document.getElementById("statTotal").textContent=total;document.getElementById("statTotalSub").textContent=`表示中 ${visible.length}件`;document.getElementById("statInProgress").textContent=inProgress;document.getElementById("statInProgressSub").textContent=`今日の稼働 ${inProgress}件`;document.getElementById("statThisWeek").textContent=thisWeek;document.getElementById("statDelayed").textContent=delayed;document.getElementById("usageProjects").textContent=`${Math.min(total,5)}/5`;document.getElementById("usageQr").textContent=`${Math.min(qrTotal,1)}/1`;document.getElementById("usageDelay").textContent=`遅延 ${delayed}件`;}
function getVisibleProjects(){return state.projects.filter(p=>{const q=state.search.toLowerCase();const hit=!q||[p.name,p.customer,p.address,p.manager].join(" ").toLowerCase().includes(q);const filterHit=state.filter==="all"?true:state.filter==="priority"?(p.priority.includes("遅延")||p.priority.includes("資材")||p.priority.includes("見積")||p.priority.includes("新規")):state.filter==="delay"?isDelayed(p):state.filter==="thisweek"?isThisWeekEnd(p):true;return hit&&filterHit;});}
async function moveProject(id,status){const project=state.projects.find(p=>p.id===id);if(!project)return;let nextProgress=project.progress;if(status==="完了")nextProgress=100;if(status==="施工中"&&nextProgress<70)nextProgress=70;if(status==="着工前"&&nextProgress>69)nextProgress=60;const prev={status:project.status,progress:project.progress};project.status=status;project.progress=nextProgress;render();try{await api("/api/kanban/move",{method:"POST",body:JSON.stringify({id,status,progress:nextProgress})});await fetchProjects();}catch(e){project.status=prev.status;project.progress=prev.progress;state.error=e.message||"更新に失敗しました";render();}}
async function saveProject(){const payload={user_id:CONFIG.USER_ID,name:document.getElementById("fName").value.trim(),customer_name:document.getElementById("fCustomer").value.trim(),manager:document.getElementById("fManager").value.trim(),address:document.getElementById("fAddress").value.trim(),status:document.getElementById("fStatus").value,progress:Number(document.getElementById("fProgress").value||0),start_date:document.getElementById("fStart").value,end_date:document.getElementById("fEnd").value,note:document.getElementById("fMemo").value.trim(),priority:"新規追加"};if(!payload.name||!payload.customer_name||!payload.address){alert("案件名・顧客名・現場住所は必須です。");return;}try{await api("/api/projects",{method:"POST",body:JSON.stringify(payload)});clearForm();document.getElementById("modalBackdrop").classList.remove("show");await fetchProjects();}catch(e){alert(e.message||"案件追加に失敗しました");}}
function clearForm(){["fName","fCustomer","fManager","fAddress","fMemo"].forEach(id=>document.getElementById(id).value="");document.getElementById("fProgress").value="20";document.getElementById("fStatus").value="見積中";document.getElementById("fStart").value="";document.getElementById("fEnd").value="";}
async function createQr(projectId){try{const data=await api("/api/qr",{method:"POST",body:JSON.stringify({project_id:projectId,user_id:CONFIG.USER_ID})});alert(`QR発行完了: ${data.qr.url}`);await fetchProjects();}catch(e){alert(e.message||"QR発行に失敗しました");}}
async function uploadFile(projectId){const input=document.getElementById("uploadFile"),select=document.getElementById("uploadType");if(!input.files||!input.files[0]){alert("ファイルを選択してください");return;}const formData=new FormData();formData.append("file",input.files[0]);formData.append("project_id",projectId);formData.append("user_id",CONFIG.USER_ID);formData.append("file_type",select.value);try{const data=await fetch(`${CONFIG.API_BASE}/api/upload`,{method:"POST",body:formData}).then(async res=>{const json=await res.json().catch(()=>({}));if(!res.ok||json.ok===false)throw new Error(json.message||json.error||"UPLOAD_ERROR");return json;});alert(`アップロード完了: ${data.file.file_name}`);input.value="";await fetchProjects();await fetchFiles(projectId);render();}catch(e){alert(e.message||"アップロードに失敗しました");}}
async function api(path,options={}){const res=await fetch(`${CONFIG.API_BASE}${path}`,{headers:{"Content-Type":"application/json"},...options});const data=await res.json().catch(()=>({}));if(!res.ok||data.ok===false)throw new Error(data.message||data.error||"API error");return data;}
function isDelayed(p){if(!p.end||p.status==="完了")return false;const t=new Date();t.setHours(0,0,0,0);const e=new Date(p.end+"T00:00:00");return e<t;}function isThisWeekEnd(p){if(!p.end)return false;const t=new Date();t.setHours(0,0,0,0);const e=new Date(p.end+"T00:00:00");const d=(e-t)/86400000;return d>=0&&d<=7;}function formatDate(s){return s?s.replaceAll("-","/"):"-";}function formatBytes(bytes){if(!bytes)return"0 B";const units=["B","KB","MB","GB"];let i=0,n=bytes;while(n>=1024&&i<units.length-1){n/=1024;i++;}return `${n.toFixed(n>=10||i===0?0:1)} ${units[i]}`;}function escapeHtml(str){return String(str).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}function escapeAttr(str){return escapeHtml(str);}
</script></body></html>
